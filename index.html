// CSV parser supporting quotes, embedded commas and newlines.
function parseCSV(text){let rows=[],row=[],field='',quote=false;for(let i=0;i<text.length;i++){let c=text[i];if(quote){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quote=false;else field+=c}else if(c==='"')quote=true;else if(c===','){row.push(field);field=''}else if(c==='\n'){row.push(field.replace(/\r$/,''));rows.push(row);row=[];field=''}else field+=c}if(field||row.length){row.push(field);rows.push(row)}return rows}
function installCSV(csv){let data=parseCSV(csv),cols=data.shift(),idx=Object.fromEntries(cols.map((c,i)=>[c.replace(/^\uFEFF/,''),i]));if(!['simplified','pinyin','russian','hsk_2025'].every(k=>idx[k]!==undefined))throw Error('Неверный формат словаря');let entries=data.filter(r=>r[idx.simplified]?.trim()&&r[idx.pinyin]?.trim()&&r[idx.russian]?.trim());entries.sort((a,b)=>(Number(a[idx.frequency_rank])||999999)-(Number(b[idx.frequency_rank])||999999));let byZh=new Map(words.map(w=>[w.zh,w]));for(let r of entries){let zh=String(r[idx.simplified]||'').trim(),hsk=Number(r[idx.hsk_2025])||0;if(byZh.has(zh)){let w=byZh.get(zh);if(!w.hsk && hsk)w.hsk=hsk;continue}if(words.length>=12000)break;let w={id:words.length,zh,py:r[idx.pinyin],ru:r[idx.russian],ex:'',expy:'',exru:'',hsk};words.push(w);byZh.set(zh,w)}loadStatus='Сохранены исходные слова и добавлены недостающие из HSK 1–6. Всего '+words.length+' записей.';render()}
async function loadVocabulary(){let cache=null;try{cache=localStorage.getItem('hanzigo-hsk-cache-v1')}catch(e){};if(cache){try{installCSV(cache);return}catch(e){try{localStorage.removeItem('hanzigo-hsk-cache-v1')}catch(e){}}}try{let response=await fetch('https://huggingface.co/datasets/Maqsudjonpolatov/hsk-chinese-uzbek-russian/resolve/main/hsk_uz_ru.csv',{mode:'cors'});if(!response.ok)throw Error('HTTP '+response.status);let csv=await response.text();installCSV(csv);try{localStorage.setItem('hanzigo-hsk-cache-v1',csv)}catch(e){}}catch(e){loadStatus='Встроенные слова доступны офлайн ('+words.length+'). Дополнительная онлайн-база HSK 7–9 сейчас недоступна.';render()}}

function shuffle40(a){let x=[...a];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}

function normalize40(v){return String(v||'').toLocaleLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zа-яё0-9\u3400-\u9fff]/gi,'')}
function recordPractice(correct){const k=todayKey();const r=practiceLog[k]||{answered:0,correct:0};r.answered++;if(correct)r.correct++;practiceLog[k]=r;try{localStorage.setItem(practiceKey,JSON.stringify(practiceLog))}catch(e){}}

function practiceNext(){practiceIndex++;if(practiceIndex>=practiceTotal){practiceMode='result';practiceQuestion=null}else nextPractice();render()}
function streak40(){let n=0,d=new Date();const k=todayKey();if(!((practiceLog[k]?.answered||0)||(studyLog[k]?.length||0)))d.setDate(d.getDate()-1);for(let i=0;i<365;i++){let key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if((practiceLog[key]?.answered||0)||(studyLog[key]?.length||0)){n++;d.setDate(d.getDate()-1)}else break}return n}

function hg41Track(w,correct){if(!w)return;const k=w.zh;let a=hg41errors[k]||{wrong:0,right:0};if(correct)a.right++;else a.wrong++;hg41errors[k]=a;hg41Save()}
function hg41Weak(){return words.filter(w=>{let x=hg41errors[w.zh];return x&&x.wrong>x.right}).sort((a,b)=>(hg41errors[b.zh].wrong-hg41errors[b.zh].right)-(hg41errors[a.zh].wrong-hg41errors[a.zh].right))}

function import40(file){if(!file||file.size>2000000){toast('Файл слишком большой');return}let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(data.app!=='HanziGo'||!data.values||typeof data.values!=='object')throw Error('format');const allowed=['hanzigo-v2-saved','hanzigo-v23-learned','hanzigo-v23-log','hanzigo-v23-goal','hanzigo-v38-srs','hanzigo-v40-practice','hanzigo-v41-errors'];if(!confirm('Восстановить прогресс из копии? Текущие данные будут заменены.'))return;for(let k of allowed)if(Object.prototype.hasOwnProperty.call(data.values,k))localStorage.setItem(k,JSON.stringify(data.values[k]));location.reload()}catch(e){toast('Неверный файл резервной копии')}};reader.readAsText(file)}

function newSession(mode=state.mode){state.mode=mode;const pool=words.filter(w=>levelMatch(w)&&w.zh&&w.ru&&!String(w.ru).startsWith('EN:'));for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}state.session=pool.slice(0,20);state.position=0;state.revealed=false;state.answer=null;}
function options(w){const other=words.filter(x=>x.id!==w.id&&x.ru&&!String(x.ru).startsWith('EN:')&&x.ru!==w.ru);const picks=[w];for(let i=0;i<3&&other.length;i++){const k=Math.floor(Math.random()*other.length);picks.push(other.splice(k,1)[0])}picks.sort((a,b)=>(a.id*31+state.position*11)%101-(b.id*31+state.position*11)%101);return picks.map(o=>`<button class="h7-option ${state.answer!==null?(o.id===w.id?'correct':o.id===state.answer?'wrong':''):''}" data-answer="${o.id}" ${state.answer!==null?'disabled':''}>${html(o.ru)}</button>`).join('')}
function study(){const w=state.session[state.position];return `<h1 style="font-size:35px">Учиться</h1><p class="h7-muted">Выбери режим и повторяй слова в своём темпе.</p><div class="h7-bar"><button class="h7-chip ${state.mode==='cards'?'active':''}" data-mode="cards">Карточки</button><button class="h7-chip ${state.mode==='quiz'?'active':''}" data-mode="quiz">Тест</button></div><div class="h7-levels">${levels.map(([v,label])=>`<button class="h7-chip ${state.level===v?'active':''}" data-study-level="${v}">${label}</button>`).join('')}</div><section class="h7-panel">${!w?'<div class="h7-empty">В выбранном уровне пока нет доступных слов. Выбери «Все» или другой уровень.</div>':`<p class="h7-status">Слово ${state.position+1} из ${state.session.length}</p><div class="h7-study-zh">${html(w.zh)}</div><div class="h7-study-py">${html(w.py)}</div>${state.mode==='quiz'?`<div class="h7-options" style="margin-top:23px">${options(w)}</div>${state.answer!==null?`<p class="h7-muted">${state.answer===w.id?'✓ Правильно!':'Правильный ответ: '+html(w.ru)}</p><button class="h7-btn" data-next>Следующее →</button>`:''}`:`<div class="h7-study-ru">${state.revealed?html(w.ru):'Нажми «Показать перевод»'}</div><div class="h7-bar"><button class="h7-btn ghost" data-sound="${w.id}">◖)) Слушать</button><button class="h7-btn ghost" data-reveal>${state.revealed?'Скрыть перевод':'Показать перевод'}</button><button class="h7-btn" data-next>Следующее →</button></div>`}`}</section><button class="h7-btn ghost" data-reset>Начать заново</button>`}
function draw(){document.querySelectorAll('[data-v6tab]').forEach(b=>{const active=b.dataset.v6tab===state.tab;b.classList.toggle('active',active);b.setAttribute('aria-current',active?'page':'false')});app.innerHTML=state.detail!==null?detail():state.tab==='home'?home():state.tab==='dictionary'?dictionary():state.tab==='study'?study():favorites()}
function navigate(tab){state.tab=tab;state.detail=null;state.limit=35;if(tab==='study'&&!state.session.length)newSession();draw();window.scrollTo(0,0)}
function persist(){saved=Array.from(favSet);try{localStorage.setItem('hanzigo-v2-saved',JSON.stringify(saved))}catch(e){}}
function act(b){const d=b.dataset;if(d.v6tab||d.tab){navigate(d.v6tab||d.tab)}else if(d.level!==undefined){state.level=d.level;state.query='';navigate('dictionary')}else if(d.studyLevel!==undefined){state.level=d.studyLevel;newSession();draw()}else if(d.open!==undefined){state.detail=Number(d.open);state.from=state.tab;draw();window.scrollTo(0,0)}else if(d.back!==undefined){state.detail=null;draw()}else if(d.favorite!==undefined){const id=Number(d.favorite);favSet.has(id)?favSet.delete(id):favSet.add(id);persist();draw()}else if(d.sound!==undefined){speak(words[Number(d.sound)]?.zh||'')}else if(d.more!==undefined){state.limit+=35;draw()}else if(d.clear!==undefined){state.query='';state.limit=35;draw();$('#h7-search')?.focus()}else if(d.mode!==undefined){newSession(d.mode);draw()}else if(d.reset!==undefined){newSession();draw()}else if(d.reveal!==undefined){state.revealed=!state.revealed;draw()}else if(d.next!==undefined){state.position=(state.position+1)%state.session.length;state.revealed=false;state.answer=null;draw()}else if(d.answer!==undefined&&state.answer===null){state.answer=Number(d.answer);draw()}}
// Capture before old listeners. Only the new interface controls interactions.
document.addEventListener('click',event=>{const b=event.target.closest('[data-v6tab],[data-tab],[data-level],[data-study-level],[data-open],[data-back],[data-favorite],[data-sound],[data-more],[data-clear],[data-mode],[data-reset],[data-reveal],[data-next],[data-answer]');if(!b)return;event.preventDefault();event.stopImmediatePropagation();act(b)},true);
let searchTimer;
document.addEventListener('input',event=>{if(event.target.id!=='h7-search')return;event.stopImmediatePropagation();state.query=event.target.value;state.limit=35;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{const input=$('#h7-search');const pos=input?.selectionStart;draw();const next=$('#h7-search');next?.focus();if(pos!==null&&pos!==undefined)next?.setSelectionRange(pos,pos)},140)},true);
newSession();draw();
})();
</script></body></html>
