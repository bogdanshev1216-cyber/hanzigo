function savedView(){let arr=saved.map(id=>words[id]).filter(Boolean);return `<p class="sub">Слова, которые ты хочешь запомнить</p><div class="row"><h2>Мои слова</h2><span class="small">${arr.length}</span></div>${arr.length?`<div class="list">${arr.map(item).join('')}</div>`:'<div class="empty">Пока пусто. Нажми ♡ возле слова в словаре.</div>'}`}
function dueIds(){return saved.filter(id=>!review[id]||review[id].next<=Date.now())}
function cardsView(){let ids=filter==='all'?saved:dueIds();if(cardIndex>=ids.length)cardIndex=0;let w=words[ids[cardIndex]];return `<p class="sub">Повторяй слова, чтобы лучше их запоминать</p><div class="stat"><div class="panel"><strong>${saved.length}</strong><span class="small">Сохранено</span></div><div class="panel"><strong>${dueIds().length}</strong><span class="small">Повторить</span></div></div><div class="row"><h2>Карточки</h2><select id="cardfilter"><option value="due" ${filter==='due'?'selected':''}>На сегодня</option><option value="all" ${filter==='all'?'selected':''}>Все слова</option></select></div>${w?`<div class="small" style="text-align:center;margin-bottom:10px">${cardIndex+1} / ${ids.length}</div><div class="card" data-flip="1"><div class="hanzi">${esc(w.zh)}</div>${flipped?`<div class="py">${esc(w.py)}</div><div class="meaning">${esc(w.ru)}</div>`:'<p class="small">Нажми, чтобы увидеть перевод</p>'}</div><div class="actions">${flipped?'<button class="btn secondary" data-grade="again">Повторить</button><button class="btn" data-grade="good">Знаю ✓</button>':'<button class="btn" data-flip="1">Показать ответ</button>'}</div><p class="muted">«Знаю» откладывает карточку на 1, 3, 7, 14 дней и далее. «Повторить» вернёт её через минуту.</p>`:'<div class="empty">'+(saved.length?'На сегодня всё! Переключи на «Все слова», чтобы тренироваться ещё.':'Сначала добавь слова в избранное ♡')+'</div>'}`}
function grade(g){let ids=filter==='all'?saved:dueIds(),id=ids[cardIndex];if(id===undefined)return;let r=review[id]||{level:0};let level=g==='good'?Math.min(r.level+1,5):0;let days=[0,1,3,7,14,30][level];review[id]={level,next:Date.now()+(g==='good'?days*86400000:60000)};localStorage.setItem('hanzigo-v2-review',JSON.stringify(review));flipped=false;if(filter==='all')cardIndex=(cardIndex+1)%ids.length;render()}
function render(){document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('active',e.dataset.tab===tab));$('#app').innerHTML=detail!==null?detailView(words[detail]):tab==='dictionary'?dictionary():tab==='saved'?savedView():cardsView()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-open],[data-save],[data-speak],[data-example],[data-back],[data-flip],[data-grade],[data-tab]');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;detail=null;flipped=false;cardIndex=0;render()}else if(b.dataset.open!==undefined){detail=Number(b.dataset.open);render()}else if(b.dataset.save!==undefined)toggle(Number(b.dataset.save));else if(b.dataset.speak!==undefined)speak(words[Number(b.dataset.speak)].zh);else if(b.dataset.example!==undefined)speak(words[Number(b.dataset.example)].ex);else if(b.dataset.back!==undefined){detail=null;render()}else if(b.dataset.flip!==undefined){flipped=!flipped;render()}else if(b.dataset.grade)grade(b.dataset.grade)});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;let pos=e.target.selectionStart;render();let s=$('#search');s.focus();s.setSelectionRange(pos,pos)}});document.addEventListener('change',e=>{if(e.target.id==='cardfilter'){filter=e.target.value;cardIndex=0;flipped=false;render()}});render();
</script></body></html>
