// CSV parser supporting quotes, embedded commas and newlines.
function parseCSV(text){let rows=[],row=[],field='',quote=false;for(let i=0;i<text.length;i++){let c=text[i];if(quote){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quote=false;else field+=c}else if(c==='"')quote=true;else if(c===','){row.push(field);field=''}else if(c==='\n'){row.push(field.replace(/\r$/,''));rows.push(row);row=[];field=''}else field+=c}if(field||row.length){row.push(field);rows.push(row)}return rows}
function installCSV(csv){let data=parseCSV(csv),cols=data.shift(),idx=Object.fromEntries(cols.map((c,i)=>[c.replace(/^\uFEFF/,''),i]));if(!['simplified','pinyin','russian','hsk_2025'].every(k=>idx[k]!==undefined))throw Error('Неверный формат словаря');let entries=data.filter(r=>r[idx.simplified]?.trim()&&r[idx.pinyin]?.trim()&&r[idx.russian]?.trim());entries.sort((a,b)=>(Number(a[idx.frequency_rank])||999999)-(Number(b[idx.frequency_rank])||999999));let byZh=new Map(words.map(w=>[w.zh,w]));for(let r of entries){let zh=String(r[idx.simplified]||'').trim(),hsk=Number(r[idx.hsk_2025])||0;if(byZh.has(zh)){let w=byZh.get(zh);w.hsk=hsk;continue}if(words.length>=7500)break;let w={id:words.length,zh,py:r[idx.pinyin],ru:r[idx.russian],ex:'',expy:'',exru:'',hsk};words.push(w);byZh.set(zh,w)}loadStatus='Загружено '+words.length+' уникальных записей. Цель проекта — 7500; объём зависит от доступной базы.';render()}
async function loadVocabulary(){let cache=localStorage.getItem('hanzigo-hsk-cache-v1');if(cache){try{installCSV(cache);return}catch(e){localStorage.removeItem('hanzigo-hsk-cache-v1')}}try{let response=await fetch('https://huggingface.co/datasets/Maqsudjonpolatov/hsk-chinese-uzbek-russian/resolve/main/hsk_uz_ru.csv',{mode:'cors'});if(!response.ok)throw Error('HTTP '+response.status);let csv=await response.text();installCSV(csv);try{localStorage.setItem('hanzigo-hsk-cache-v1',csv)}catch(e){}}catch(e){loadStatus='Расширенная база недоступна: сейчас доступны '+words.length+' встроенных записей. Проверь подключение.';render()}}

function getExamples(w){let all=[...(examples24[w.zh]||[]),...(w.ex?[{zh:w.ex,py:w.expy,ru:w.exru}]:[]),...(addedExamples241[w.zh]||[]),...(examples32[w.zh]||[]),...(examples33[w.zh]||[]),...(examples34[w.zh]||[]),...(examples35[w.zh]||[]),...(examples36[w.zh]||[]),...(thematicExamples37[w.zh]||[])];let seen=new Set();return all.filter(e=>{let key=normalizeExample(e.zh);if(!key||seen.has(key))return false;seen.add(key);return true}).slice(0,5)}
function exampleCoverage(){let with3=0,withAny=0;for(const w of words){let n=getExamples(w).length;if(n>=3)with3++;if(n)withAny++}return {with3,withAny,total:words.length}}
function detailView(w){let examples=getExamples(w);return `<button class="back" data-back="1">← Назад к словарю</button><div class="panel" style="margin-top:18px"><div class="detailH">${esc(w.zh)}</div><div class="detailPy">${esc(w.py)}</div><div class="detailMeaning">${esc(w.ru)}</div>${w.category?`<div class="category-note" style="text-align:center">${esc(w.category)}</div>`:''}<div class="actions"><button class="btn secondary" data-speak="${w.id}">🔊 Слушать</button><button class="btn" data-save="${w.id}">${saved.includes(w.id)?'♥ В избранном':'♡ Сохранить'}</button></div><div class="learning-actions"><button class="mini-btn" data-${learned[w.zh]?'unlearn':'learn'}="${w.id}">${learned[w.zh]?'↩ Ещё учу':'✓ Отметить выученным'}</button></div>${examples.length?`<h2 class="example-heading">Примеры (${examples.length})</h2>${examples.map((e,i)=>`<div class="example"><div class="zh">${esc(e.zh)}</div><div class="latin">${esc(e.py)}</div><div class="ru" id="exru-${w.id}-${i}">${esc(e.ru)}</div><button class="example-audio" type="button" data-toggle-ru="exru-${w.id}-${i}" aria-expanded="true">🙈 Скрыть перевод</button><button class="example-audio" data-ex24="${w.id}:${i}">🔊 Слушать пример</button></div>`).join('')}`:`<p class="muted">Примеры для этого слова пока не добавлены.</p>`}</div>`}

function savedView(){let arr=saved.map(id=>words[id]).filter(Boolean);return `<p class="sub">Слова, которые ты хочешь запомнить</p><div class="row"><h2>Мои слова</h2><span class="small">${arr.length}</span></div>${arr.length?`<div class="list">${arr.map(item).join('')}</div>`:'<div class="empty">Пока пусто. Нажми ♡ возле слова в словаре.</div>'}`}
function dueIds(){return saved.filter(id=>!review[id]||review[id].next<=Date.now())}
function cardsView(){let ids=filter==='all'?saved:dueIds();if(cardIndex>=ids.length)cardIndex=0;let w=words[ids[cardIndex]];return `<p class="sub">Повторяй слова, чтобы лучше их запоминать</p><div class="stat"><div class="panel"><strong>${saved.length}</strong><span class="small">Сохранено</span></div><div class="panel"><strong>${dueIds().length}</strong><span class="small">Повторить</span></div></div><div class="row"><h2>Карточки</h2><select id="cardfilter"><option value="due" ${filter==='due'?'selected':''}>На сегодня</option><option value="all" ${filter==='all'?'selected':''}>Все слова</option></select></div>${w?`<div class="small" style="text-align:center;margin-bottom:10px">${cardIndex+1} / ${ids.length}</div><div class="card" data-flip="1"><div class="hanzi">${esc(w.zh)}</div>${flipped?`<div class="py">${esc(w.py)}</div><div class="meaning">${esc(w.ru)}</div>`:'<p class="small">Нажми, чтобы увидеть перевод</p>'}</div><div class="actions">${flipped?'<button class="btn secondary" data-grade="again">Повторить</button><button class="btn" data-grade="good">Знаю ✓</button>':'<button class="btn" data-flip="1">Показать ответ</button>'}</div><p class="muted">«Знаю» откладывает карточку на 1, 3, 7, 14 дней и далее. «Повторить» вернёт её через минуту.</p>`:'<div class="empty">'+(saved.length?'На сегодня всё! Переключи на «Все слова», чтобы тренироваться ещё.':'Сначала добавь слова в избранное ♡')+'</div>'}`}
function grade(g){let ids=filter==='all'?saved:dueIds(),id=ids[cardIndex];if(id===undefined)return;let r=review[id]||{level:0};let level=g==='good'?Math.min(r.level+1,5):0;let days=[0,1,3,7,14,30][level];review[id]={level,next:Date.now()+(g==='good'?days*86400000:60000)};localStorage.setItem('hanzigo-v2-review',JSON.stringify(review));flipped=false;if(filter==='all')cardIndex=(cardIndex+1)%ids.length;render()}

let dailyGoal=get('hanzigo-v23-goal',10);
let studyLevel='1',studyId=null,studyReveal=false;
function todayKey(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
let studyLog=get('hanzigo-v23-log',{});
function persistStudy(){localStorage.setItem('hanzigo-v23-learned',JSON.stringify(learned));localStorage.setItem('hanzigo-v23-log',JSON.stringify(studyLog))}
function learnedCount(arr){return arr.filter(w=>!!learned[w.zh]).length}
function todayCount(){return (studyLog[todayKey()]||[]).length}
function levelWords(level){return words.filter(w=>String(w.hsk)===String(level))}
function nextStudy(){let pool=levelWords(studyLevel).filter(w=>!learned[w.zh]);if(!pool.length){studyId=null;studyReveal=false;return}let next=pool.find(w=>w.id!==studyId)||pool[0];studyId=next.id;studyReveal=false}
function markLearned(id){let w=words[id];if(!w)return;let isNew=!learned[w.zh];learned[w.zh]=Date.now();if(isNew){let key=todayKey();studyLog[key]=studyLog[key]||[];if(!studyLog[key].includes(w.zh))studyLog[key].push(w.zh)}persistStudy();if(studyId===id)nextStudy();render()}
function unmarkLearned(id){let w=words[id];if(!w)return;delete learned[w.zh];persistStudy();render()}
function learningView(){let total=words.length,known=learnedCount(words),done=todayCount(),pct=Math.min(100,Math.round(done/dailyGoal*100));let levels=[1,2,3,4,5,6,7];return `<p class="sub">Учи китайский в своём темпе • прогресс сохраняется на устройстве</p><div class="learning-grid"><div class="learning-stat"><span class="small">Всего выучено</span><strong>${known}</strong><span class="small">из ${total} слов</span></div><div class="learning-stat"><span class="small">Сегодня</span><strong>${done} / ${dailyGoal}</strong><span class="small">новых слов</span></div></div><div class="panel" style="margin-top:12px"><div class="row"><strong>Ежедневная цель</strong><select id="dailygoal" class="goal-select">${[5,10,20].map(n=>`<option value="${n}" ${dailyGoal===n?'selected':''}>${n} слов</option>`).join('')}</select></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div class="small">${done>=dailyGoal?'Цель на сегодня выполнена! 🎉':'До цели осталось '+(dailyGoal-done)+' слов'}</div></div><h2>Мой прогресс HSK</h2><div class="panel">${levels.map(n=>{let arr=levelWords(n),k=learnedCount(arr),p=arr.length?Math.round(100*k/arr.length):0;return `<div class="level-row"><div class="level-meta"><strong>${n===7?'HSK 7–9':'HSK '+n}</strong><span class="small">${k} из ${arr.length} • ${p}%</span><div class="progress-track" style="margin:7px 0 0"><div class="progress-fill" style="width:${p}%"></div></div></div><button class="mini-btn" data-level="${n}">Учить</button></div>`}).join('')}</div><p class="muted-note">Уровни соответствуют меткам текущей словарной базы. Проценты показывают прогресс среди загруженных слов, а не всего официального списка HSK.</p>`}
function lessonView(){let pool=levelWords(studyLevel),known=learnedCount(pool),w=studyId===null?null:words[studyId];return `<button class="back" data-exitlesson="1">← К прогрессу</button><div class="row"><h2>${studyLevel==='7'?'HSK 7–9':'HSK '+studyLevel}</h2><span class="small">${known} / ${pool.length} выучено</span></div>${w?`<div class="lesson-card"><div class="hanzi">${esc(w.zh)}</div>${studyReveal?`<div class="py">${esc(w.py)}</div><div class="meaning">${esc(w.ru)}</div>`:'<div class="small">Попробуй вспомнить перевод</div>'}<button class="mini-btn" data-speak="${w.id}">🔊 Произнести</button></div><div class="learning-actions">${studyReveal?`<button class="btn secondary" data-nextstudy="1">Повторить позже</button><button class="btn" data-learn="${w.id}">Знаю ✓</button>`:`<button class="btn" data-reveal="1">Показать перевод</button>`}</div>`:`<div class="empty">${pool.length?'Все загруженные слова этого уровня отмечены как выученные!':'Для этого уровня пока нет слов в базе.'}</div>`}<p class="muted-note">«Знаю» отмечает слово выученным. Для интервального повторения используй вкладку «Карточки».</p>`}
function render(){document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('active',e.dataset.tab===tab));$('#app').innerHTML=tab==='learning'?(studyId!==null?lessonView():learningView()):detail!==null?detailView(words[detail]):tab==='dictionary'?dictionary():tab==='saved'?savedView():cardsView()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-open],[data-save],[data-speak],[data-example],[data-back],[data-flip],[data-grade],[data-tab],[data-level],[data-exitlesson],[data-reveal],[data-nextstudy],[data-learn],[data-unlearn],[data-category],[data-ex24],[data-toggle-ru]');if(!b)return;if(b.dataset.toggleRu!==undefined){let target=document.getElementById(b.dataset.toggleRu);if(target){let hide=target.style.display!=="none";target.style.display=hide?"none":"";b.textContent=hide?"👁 Показать перевод":"🙈 Скрыть перевод";b.setAttribute("aria-expanded",String(!hide))}}else if(b.dataset.category!==undefined){category24=b.dataset.category;tab='dictionary';detail=null;render()}else if(b.dataset.ex24!==undefined){let [id,i]=b.dataset.ex24.split(':').map(Number);let w=words[id];let ex=getExamples(w);if(ex[i])speak(ex[i].zh)}else if(b.dataset.tab){tab=b.dataset.tab;detail=null;studyId=null;flipped=false;cardIndex=0;render()}else if(b.dataset.level!==undefined){studyLevel=b.dataset.level;nextStudy();render()}else if(b.dataset.exitlesson!==undefined){studyId=null;render()}else if(b.dataset.reveal!==undefined){studyReveal=true;render()}else if(b.dataset.nextstudy!==undefined){nextStudy();render()}else if(b.dataset.learn!==undefined){markLearned(Number(b.dataset.learn))}else if(b.dataset.unlearn!==undefined){unmarkLearned(Number(b.dataset.unlearn))}else if(b.dataset.open!==undefined){detail=Number(b.dataset.open);render()}else if(b.dataset.save!==undefined)toggle(Number(b.dataset.save));else if(b.dataset.speak!==undefined)speak(words[Number(b.dataset.speak)].zh);else if(b.dataset.example!==undefined)speak(words[Number(b.dataset.example)].ex);else if(b.dataset.back!==undefined){detail=null;render()}else if(b.dataset.flip!==undefined){flipped=!flipped;render()}else if(b.dataset.grade)grade(b.dataset.grade)});
// Keep the native search input mounted while the Chinese Pinyin IME is composing.
// Replacing the input on every keystroke breaks iOS Safari composition and reverses text.
let searchComposing=false;
function updateSearchResults(){
  if(tab!=='dictionary'||detail!==null)return;
  const results=document.getElementById('results'),count=document.getElementById('result-count');
  if(!results||!count)return;
  const found=filteredWords();
  count.textContent=`${found.length} из ${words.length}`;
  results.innerHTML=found.length?found.map(item).join(''):'<div class="empty">Ничего не найдено. Попробуй другое слово.</div>';
}
document.addEventListener('compositionstart',e=>{if(e.target.id==='search')searchComposing=true});
document.addEventListener('compositionend',e=>{if(e.target.id==='search'){searchComposing=false;query=e.target.value;updateSearchResults()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){if(searchComposing||e.isComposing)return;query=e.target.value;updateSearchResults()}});document.addEventListener('change',e=>{if(e.target.id==='dailygoal'){dailyGoal=Number(e.target.value);localStorage.setItem('hanzigo-v23-goal',JSON.stringify(dailyGoal));render()}else if(e.target.id==='cardfilter'){filter=e.target.value;cardIndex=0;flipped=false;render()}else if(e.target.id==='hsklevel'){hskLevel=e.target.value;render()}});render();
loadVocabulary();
</script></body></html>
