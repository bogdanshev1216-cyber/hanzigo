function list(items){return `<div class="list">${items.map(entry).join('')}</div>`}
function home(){const samples=WORDS.filter(w=>w.ru).slice(0,4);return `<h1>Китайский — просто.</h1><p class="intro muted">Понятный китайско-русский словарь. Иероглифы, пиньинь, перевод и произношение.</p><div class="searchbox"><input id="home-search" placeholder="Найти слово: 中文, pinyin, русский" aria-label="Поиск слова" autocomplete="off"><span class="glass">⌕</span></div><div class="hero card"><strong>Найди нужное слово</strong><p>Открой словарь, выбери уровень HSK или ищи на китайском и русском языке.</p><button class="primary" data-tab="dictionary">Открыть словарь →</button></div><div class="stats"><div class="stat card"><b>${num(WORDS.length)}</b><span>записей в базе</span></div><div class="stat card"><b>${num(favorites.size)}</b><span>в избранном</span></div></div><section class="section"><h2>Выбрать уровень</h2>${levels()}<p class="footnote">HSK 1–6 — по присланным спискам. Для HSK 7–9 пока нет подтверждённой отдельной базы; слова не выдумываются.</p></section><section class="section"><h2>Примеры слов</h2>${list(samples)}</section>`}
function dictionary(){let found=filterWords();return `<h1>Словарь</h1><p class="intro muted">Ищи по иероглифам, пиньиню или русскому переводу.</p><div class="searchbox"><input id="dict-search" value="${esc(state.query)}" placeholder="Например: 聪明, cōngmíng, умный" aria-label="Поиск слов" autocomplete="off"><span class="glass">⌕</span></div><div class="quality-controls"><label class="quality-toggle"><input type="checkbox" id="verified-only" ${state.verifiedOnly?'checked':''}> Только слова с русским переводом</label><span class="muted">${num(WORDS.filter(w=>w.ru).length)} переведено из ${num(WORDS.length)}</span></div><section class="section"><h2>Уровень</h2>${levels()}</section><section class="section"><div class="toolbar"><h2 style="margin:0">Результаты</h2><p>${num(found.length)} слов</p></div>${found.length?list(found.slice(0,state.limit)):'<div class="empty card">Ничего не найдено. Попробуй другое слово или выбери «Все слова».</div>'}${found.length>state.limit?`<div style="margin-top:16px;text-align:center"><button class="secondary" data-more>Показать ещё (${num(found.length-state.limit)})</button></div>`:''}</section><section class="section card"><h2>Мои переводы</h2><p class="muted">Если исправляешь значения, сохрани резервную копию. Можно перенести её на другой телефон или компьютер.</p><div class="btnrow"><button class="secondary" data-export-translations>Экспорт переводов</button><button class="secondary" data-import-translations>Импорт переводов</button></div><input id="import-translations-file" type="file" accept="application/json,.json" hidden></section>`}
function detail(){let w=byId.get(state.detail);if(!w)return dictionary();return `<button class="back" data-back>← Назад</button><div class="detail card"><div class="bigzh">${esc(w.zh)}</div><div class="bigpy">${esc(w.py)}</div><div class="badge">${levelName(w.hsk)}</div><div class="bigru">${esc(ru(w))}</div><div class="btnrow" style="margin-top:22px"><button class="primary" data-speak="${w.id}">▶ Произнести</button><button class="secondary" data-fav="${w.id}">${favorites.has(w.id)?'♥ В избранном':'♡ В избранное'}</button></div>${w.ex?`<section class="section"><h2>Пример</h2><div class="example"><div class="zh">${esc(w.ex)}</div><div class="py">${esc(w.expy)}</div><div class="exru">${esc(w.exru)}</div></div></section>`:''}<div class="translation-editor"><label for="translation-edit"><strong>${w.ru?'Исправить перевод':'Добавить русский перевод'}</strong></label><textarea id="translation-edit" rows="2" placeholder="Русский перевод">${esc(w.ru)}</textarea><button class="secondary" data-save-translation="${w.id}">Сохранить перевод на этом устройстве</button><p class="muted">Ваши изменения сохраняются только в этом браузере. Для переноса используйте экспорт в разделе «Словарь».</p></div>${!w.ru?'<div class="notice" style="margin-top:18px">Для этой записи русский перевод ещё не добавлен.</div>':''}</div>`}
function savedView(){let a=WORDS.filter(w=>favorites.has(w.id));return `<h1>Избранное</h1><p class="intro muted">Слова, которые ты сохранил для повторения.</p><div class="toolbar"><h2 style="margin:0">Мои слова</h2><p>${num(a.length)}</p></div>${a.length?list(a.slice(0,state.limit))+(a.length>state.limit?'<div style="margin-top:15px"><button class="secondary" data-more>Показать ещё</button></div>':''):'<div class="empty card">Пока пусто. Нажми ♡ возле любого слова в словаре.</div>'}`}
function studyPool(){let a=WORDS.filter(w=>w.ru&&(state.level==='all'||w.hsk===Number(state.level)));return a}
function startStudy(mode){state.mode=mode;let a=studyPool();if(!a.length){state.session=[];render();return}let shuffled=[...a];for(let i=shuffled.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}state.session=shuffled.slice(0,10).map(w=>w.id);state.pos=0;state.flipped=false;state.answered=null;render()}
function study(){let w=byId.get(state.session[state.pos]);return `<h1>Учиться</h1><p class="intro muted">Простые карточки и тесты на основе словаря.</p><section class="section"><h2>Выбери уровень</h2>${levels()}</section><div class="btnrow section"><button class="${state.mode==='cards'?'primary':'secondary'}" data-mode="cards">Карточки</button><button class="${state.mode==='quiz'?'primary':'secondary'}" data-mode="quiz">Тест</button></div>${!w?`<div class="hero card"><strong>Готов начать?</strong><p>Выбери режим и нажми кнопку ниже. В каждом подходе — 10 слов с русским переводом.</p><button class="primary" data-start>Начать</button></div>`:`<p class="muted" style="margin-top:18px">Слово ${state.pos+1} из ${state.session.length}</p><div class="studycard card"><div class="bigzh">${esc(w.zh)}</div><div class="bigpy">${esc(w.py)}</div><button class="secondary" data-speak="${w.id}">▶ Слушать</button>${state.mode==='cards'&&state.flipped?`<div class="bigru">${esc(w.ru)}</div>`:''}</div>${state.mode==='cards'?`<div class="btnrow section"><button class="primary" data-flip>${state.flipped?'Скрыть перевод':'Показать перевод'}</button><button class="secondary" data-next>Следующее слово →</button></div>`:quizOptions(w)}<div class="control"><button class="secondary" data-start>Начать заново</button></div>`}`}
function quizOptions(w){let others=studyPool().filter(x=>x.id!==w.id&&x.ru!==w.ru);let opts=[w,...others.sort(()=>Math.random()-.5).slice(0,3)]; // options are fixed per question below
if(!state.options||state.optionsFor!==w.id){for(let i=opts.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]}state.options=opts.map(x=>x.id);state.optionsFor=w.id}
return `<div class="studyopts">${state.options.map(id=>{let x=byId.get(id);let cl=state.answered===null?'':id===w.id?'correct':id===state.answered?'wrong':'';return `<button class="${cl}" data-answer="${id}" ${state.answered!==null?'disabled':''}>${esc(x.ru)}</button>`}).join('')}</div>${state.answered!==null?`<div class="notice section">${state.answered===w.id?'Верно!':'Правильный ответ: '+esc(w.ru)}</div><div class="section"><button class="primary" data-next>Следующее слово →</button></div>`:''}`}
function speak(w){if(!w||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(w.zh);u.lang='zh-CN';u.rate=.82;speechSynthesis.speak(u)}catch(e){}}
function nav(){return `<nav class="bottom" aria-label="Главная навигация"><div class="nav">${[['home','⌂','Главная'],['dictionary','⌕','Словарь'],['study','▣','Учиться'],['saved','♡','Избранное']].map(([id,ico,label])=>`<button data-tab="${id}" class="${state.tab===id?'active':''}" aria-current="${state.tab===id?'page':'false'}"><span class="symbol">${ico}</span>${label}</button>`).join('')}</div></nav>`}
function render(){app.innerHTML=`<main><header class="top"><div class="brand">Hanzi<span>Go</span></div><div class="version">7.3 · Словарь</div></header>${state.detail!==null?detail():state.tab==='home'?home():state.tab==='dictionary'?dictionary():state.tab==='saved'?savedView():study()}</main>${nav()}`}
function switchTab(t){state.tab=t;state.detail=null;state.limit=35;state.query='';state.session=[];render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{let b=e.target.closest('button[data-tab],button[data-level],button[data-open],button[data-fav],button[data-speak],button[data-back],button[data-more],button[data-mode],button[data-start],button[data-flip],button[data-next],button[data-answer],button[data-save-translation],button[data-export-translations],button[data-import-translations]');if(!b)return;let d=b.dataset;if(d.saveTranslation!==undefined){let w=byId.get(Number(d.saveTranslation));let val=document.getElementById('translation-edit')?.value.trim();if(w&&val){w.ru=val;translationOverrides[w.zh+'|'+w.py]=val;set('hanzigo-translation-overrides',translationOverrides);render()}else alert('Введите русский перевод.')}else if(d.exportTranslations!==undefined){let blob=new Blob([JSON.stringify({format:'hanzigo-translations-v1',translations:translationOverrides},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='hanzigo-my-translations.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}else if(d.importTranslations!==undefined){document.getElementById('import-translations-file')?.click()}else if(d.tab){switchTab(d.tab)}else if(d.level!==undefined){state.level=d.level==='all'?'all':Number(d.level);set('hanzigo-preferred-level',state.level);state.limit=35;state.session=[];state.detail=null;render()}else if(d.open!==undefined){state.detail=Number(d.open);render();window.scrollTo(0,0)}else if(d.fav!==undefined){let id=Number(d.fav);favorites.has(id)?favorites.delete(id):favorites.add(id);set('hanzigo-v2-saved',[...favorites]);render()}else if(d.speak!==undefined){speak(byId.get(Number(d.speak)))}else if(d.back!==undefined){state.detail=null;render()}else if(d.more!==undefined){state.limit+=35;render()}else if(d.mode){state.mode=d.mode;state.session=[];render()}else if(d.start!==undefined){startStudy(state.mode)}else if(d.flip!==undefined){state.flipped=!state.flipped;render()}else if(d.next!==undefined){state.pos++;state.flipped=false;state.answered=null;state.options=null;state.optionsFor=null;if(state.pos>=state.session.length)state.session=[];render()}else if(d.answer!==undefined&&state.answered===null){state.answered=Number(d.answer);render()}});
document.addEventListener('change',async e=>{if(e.target.id==='verified-only'){state.verifiedOnly=e.target.checked;state.limit=35;render()}else if(e.target.id==='import-translations-file'){let file=e.target.files?.[0];if(!file)return;try{let j=JSON.parse(await file.text());if(j.format!=='hanzigo-translations-v1'||!j.translations||typeof j.translations!=='object')throw Error('Неверный формат');let n=0;for(let w of WORDS){let v=j.translations[w.zh+'|'+w.py];if(typeof v==='string'&&v.trim()){w.ru=v.trim();translationOverrides[w.zh+'|'+w.py]=w.ru;n++}}set('hanzigo-translation-overrides',translationOverrides);render();alert('Импортировано переводов: '+n)}catch(err){alert('Не удалось импортировать файл: '+err.message)}}});
// Delegated input handler avoids re-rendering on each keystroke; debounce and restore focus.
let timer;document.addEventListener('input',e=>{if(e.target.id==='home-search'){state.query=e.target.value;state.tab='dictionary';state.limit=35;render();let inp=document.getElementById('dict-search');inp?.focus();inp?.setSelectionRange(inp.value.length,inp.value.length)}else if(e.target.id==='dict-search'){state.query=e.target.value;state.limit=35;clearTimeout(timer);timer=setTimeout(()=>{let el=document.getElementById('dict-search');let pos=el?.selectionStart??state.query.length;render();el=document.getElementById('dict-search');el?.focus();try{el?.setSelectionRange(pos,pos)}catch(e){}},110)}});
render();
})();
</script></body></html>
