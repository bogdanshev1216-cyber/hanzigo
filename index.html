<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#bd3434"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="HanziGo"><title>HanziGo — китайский словарь</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#24252b;background:#faf8f6}*{box-sizing:border-box}body{margin:0}header{background:#bd3434;color:white;padding:calc(24px + env(safe-area-inset-top)) 20px 20px}h1{margin:0;font-size:29px}header p{margin:5px 0 0;opacity:.9}.wrap{max-width:650px;margin:auto;padding:18px 16px 110px}input{width:100%;padding:15px;border:1px solid #e2dedb;border-radius:14px;font-size:16px;background:white}button{cursor:pointer;font:inherit}.word{background:white;border:1px solid #ebe5e0;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 10px #00000006}.wordtop{display:flex;justify-content:space-between;align-items:start}.hanzi{font-size:29px;font-weight:650}.pinyin{color:#b33232;font-size:15px;margin:3px 0}.meaning{font-size:16px;margin:7px 0}.example{border-top:1px solid #eee;padding-top:10px;margin-top:12px;color:#56545a;font-size:14px}.example div{margin:3px 0}.star{border:0;background:#f6eeee;color:#b33232;border-radius:10px;padding:10px 13px;font-size:22px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e6dfd9;display:flex;padding:9px 4px calc(9px + env(safe-area-inset-bottom));justify-content:space-around}.tabs button{border:0;background:transparent;color:#666;font-size:14px;padding:8px 12px}.tabs button.active{color:#b33232;font-weight:700}.hide{display:none}.pill{background:#b33232;color:white;border:0;border-radius:12px;padding:12px 17px;margin:7px 5px 7px 0}.muted{color:#777}.flash{background:white;min-height:230px;border:1px solid #eee;border-radius:22px;display:flex;align-items:center;justify-content:center;flex-direction:column;margin:20px 0;padding:24px;text-align:center}.flash .hanzi{font-size:50px}.empty{padding:30px;text-align:center;color:#777}</style></head><body><header><h1>汉字 Go · HanziGo</h1><p>Твой китайский словарь и карточки</p></header><main class="wrap"><section id="dictionary"><input id="search" placeholder="Поиск: 你好, nǐ hǎo, привет" autocomplete="off"><div id="results"></div></section><section id="saved" class="hide"><h2>Избранные слова</h2><div id="savedResults"></div></section><section id="cards" class="hide"><h2>Карточки</h2><p class="muted">Добавь слова в избранное, чтобы повторять их здесь.</p><div id="flashArea"></div></section></main><nav class="tabs"><button class="active" data-tab="dictionary">⌕ Словарь</button><button data-tab="saved">☆ Избранное</button><button data-tab="cards">▣ Карточки</button></nav><script>
const words=[['你好','nǐ hǎo','привет','你好！很高兴认识你。','Nǐ hǎo! Hěn gāoxìng rènshi nǐ.','Привет! Рад познакомиться.'],['谢谢','xièxie','спасибо','谢谢你的帮助。','Xièxie nǐ de bāngzhù.','Спасибо за твою помощь.'],['学习','xuéxí','учиться, изучать','我在学习中文。','Wǒ zài xuéxí Zhōngwén.','Я изучаю китайский.'],['朋友','péngyou','друг','他是我的朋友。','Tā shì wǒ de péngyou.','Он мой друг.'],['麻烦','máfan','хлопоты; беспокоить','麻烦你帮我一下。','Máfan nǐ bāng wǒ yíxià.','Не мог бы ты мне помочь?'],['工作','gōngzuò','работа; работать','我今天要工作。','Wǒ jīntiān yào gōngzuò.','Сегодня мне нужно работать.'],['价格','jiàgé','цена','这个价格是多少？','Zhège jiàgé shì duōshao?','Какая цена?'],['可以','kěyǐ','можно; мочь','我可以进去吗？','Wǒ kěyǐ jìnqù ma?','Можно мне войти?'],['今天','jīntiān','сегодня','今天天气很好。','Jīntiān tiānqì hěn hǎo.','Сегодня хорошая погода.'],['喜欢','xǐhuan','нравиться; любить','我喜欢中国菜。','Wǒ xǐhuan Zhōngguó cài.','Мне нравится китайская кухня.'],['多少钱','duōshao qián','сколько стоит','这个多少钱？','Zhège duōshao qián?','Сколько это стоит?'],['明天','míngtiān','завтра','我们明天见。','Wǒmen míngtiān jiàn.','Увидимся завтра.']];
const normalize=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ü/g,'v');let fav;try{fav=JSON.parse(localStorage.getItem('hanzigo-fav')||'[]')}catch{fav=[]}let idx=0,revealed=false;function save(){localStorage.setItem('hanzigo-fav',JSON.stringify(fav));render()}function toggle(i){fav=fav.includes(i)?fav.filter(x=>x!==i):[...fav,i];save()}function item(w){const i=words.indexOf(w);return `<article class="word"><div class="wordtop"><div><div class="hanzi">${w[0]}</div><div class="pinyin">${w[1]}</div></div><button class="star" aria-label="Избранное" onclick="toggle(${i})">${fav.includes(i)?'★':'☆'}</button></div><div class="meaning">${w[2]}</div><div class="example"><div>${w[3]}</div><div class="pinyin">${w[4]}</div><div>${w[5]}</div></div></article>`}function render(){const q=normalize(document.getElementById('search').value.trim());const found=words.filter(w=>w.some((v,i)=>i<3&&normalize(v).includes(q)));document.getElementById('results').innerHTML=found.length?found.map(item).join(''):'<div class="empty">Слово не найдено в демонстрационной базе</div>';document.getElementById('savedResults').innerHTML=fav.length?fav.map(i=>words[i]).filter(Boolean).map(item).join(''):'<div class="empty">Нажми ☆ рядом со словом, чтобы сохранить его.</div>';cardRender()}function cardRender(){const area=document.getElementById('flashArea');if(!fav.length){area.innerHTML='<div class="empty">Пока нет карточек</div>';return}idx=idx%fav.length;const w=words[fav[idx]];area.innerHTML=`<div class="flash"><div class="hanzi">${w[0]}</div>${revealed?`<div class="pinyin">${w[1]}</div><p>${w[2]}</p><small>${w[3]}</small>`:'<p class="muted">Попробуй вспомнить перевод</p>'}</div><button class="pill" onclick="revealed=!revealed;cardRender()">${revealed?'Скрыть ответ':'Показать ответ'}</button><button class="pill" onclick="idx++;revealed=false;cardRender()">Следующее →</button><p class="muted">Карточка ${idx+1} из ${fav.length}</p>`}document.getElementById('search').addEventListener('input',render);document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['dictionary','saved','cards'].forEach(x=>document.getElementById(x).classList.toggle('hide',x!==b.dataset.tab));render()}));render();
</script></body></html>
