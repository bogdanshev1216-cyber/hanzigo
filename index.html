<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf7f2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="HanziGo"><title>HanziGo — китайский словарь</title><style>

:#c64e43;font-size:21px;margin:4px}.detailMeaning{text-align:center;font-size:17px;margin:10px 0 20px}.example{padding:15px;background:#faf7f2;border-radius:14px;line-height:1.7;margin-top:12px}.example .zh{font-size:20px}.example .latin{color:#bd5a50;font-size:13px}.example .ru{color:#666;font-size:14px}.card{background:white;border:1px solid #ece3da;border-radius:25px;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:25px;text-align:center;box-shadow:0 9px 25px #422d1808}.card .hanzi{font-size:63px}.card .meaning{font-size:19px}.actions{display:flex;gap:9px;margin-top:16px}.actions button{flex:1}.empty{text-align:center;padding:35px 15px;color:#8c827d}.stat{display:flex;gap:10px}.stat .panel{flex:1;text-align:center}.stat strong{display:block;font-size:25px;color:#c8443d}.back{border:0;background:transparent;color:#bc4b42;padding:0;font-weight:650}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#2f2b29;color:white;border-radius:30px;padding:12px 18px;z-index:10;max-width:90%;font-size:13px;display:none}select{background:white;border:1px solid #e8dfd7;border-radius:12px;padding:10px}.muted{color:#888;font-size:13px;line-height:1.5}
</style></head><body><div id="toast" class="toast"></div><main><div class="top"><div class="logo">Hanzi<b>Go</b></div><div class="pill">Версия 2.0</div></div><div id="app"></div></main><nav class="tabbar"><div class="tabs"><button class="tab active" data-tab="dictionary"><span>⌕</span>Словарь</button><button class="tab" data-tab="saved"><span>♡</span>Мои слова</button><button class="tab" data-tab="cards"><span>▣</span>Карточки</button></div></nav><script>
// Educational starter dataset. All entries and examples are authored for this demo.
const raw=[
['你好','nǐ hǎo','привет','你好！很高兴认识你。','Nǐ hǎo! Hěn gāoxìng rènshi nǐ.','Привет! Рад познакомиться.'],

['快递','kuàidì','курьерская доставка; посылка','快递到了吗？','Kuàidì dào le ma?','Посылка пришла?'],
['地址','dìzhǐ','адрес','请发给我地址。','Qǐng fā gěi wǒ dìzhǐ.','Пришли мне адрес, пожалуйста.'],
['时间','shíjiān','время','你有时间吗？','Nǐ yǒu shíjiān ma?','У тебя есть время?'],
['今天','jīntiān','сегодня','今天很忙。','Jīntiān hěn máng.','Сегодня много дел.'],
['明天','míngtiān','завтра','我们明天见。','Wǒmen míngtiān jiàn.','Увидимся завтра.'],
['昨天','zuótiān','вчера','昨天我很累。','Zuótiān wǒ hěn lèi.','Вчера я очень устал.'],
['现在','xiànzài','сейчас','你现在忙吗？','Nǐ xiànzài máng ma?','Ты сейчас занят?'],
['可以','kěyǐ','можно; разрешается','这里可以坐吗？','Zhèlǐ kěyǐ zuò ma?','Здесь можно сесть?'],
['需要','xūyào','нуждаться; требоваться','我需要一点时间。','Wǒ xūyào yìdiǎn shíjiān.','Мне нужно немного времени.'],
['知道','zhīdào','знать','我不知道。','Wǒ bù zhīdào.','Я не знаю.'],
['认识','rènshi','быть знакомым; знать человека','你认识他吗？','Nǐ rènshi tā ma?','Ты его знаешь?'],
['觉得','juéde','считать; чувствовать','我觉得很好。','Wǒ juéde hěn hǎo.','Я считаю, что это очень хорошо.'],
['喜欢','xǐhuan','нравиться; любить','我喜欢喝茶。','Wǒ xǐhuan hē chá.','Я люблю пить чай.'],
['想','xiǎng','хотеть; думать','我想休息一下。','Wǒ xiǎng xiūxi yíxià.','Я хочу немного отдохнуть.'],
['吃饭','chīfàn','есть; принимать пищу','我们一起吃饭吧。','Wǒmen yìqǐ chīfàn ba.','Давай поедим вместе.'],
['喝水','hē shuǐ','пить воду','多喝水。','Duō hē shuǐ.','Пей больше воды.'],
['咖啡','kāfēi','кофе','我要一杯咖啡。','Wǒ yào yì bēi kāfēi.','Мне одну чашку кофе.'],
['茶','chá','чай','你喜欢什么茶？','Nǐ xǐhuan shénme chá?','Какой чай тебе нравится?'],
['饭店','fàndiàn','ресторан; гостиница','这家饭店很好。','Zhè jiā fàndiàn hěn hǎo.','Этот ресторан очень хороший.'],
['医院','yīyuàn','больница','医院在哪里？','Yīyuàn zài nǎlǐ?','Где находится больница?'],
['地铁','dìtiě','метро','我们坐地铁去吧。','Wǒmen zuò dìtiě qù ba.','Давай поедем на метро.'],
['火车','huǒchē','поезд','火车几点出发？','Huǒchē jǐ diǎn chūfā?','Во сколько отправляется поезд?'],
['飞机','fēijī','самолёт','飞机晚点了。','Fēijī wǎndiǎn le.','Самолёт задержался.'],
['机场','jīchǎng','аэропорт','我在机场等你。','Wǒ zài jīchǎng děng nǐ.','Я жду тебя в аэропорту.'],
['天气','tiānqì','погода','今天天气不错。','Jīntiān tiānqì búcuò.','Сегодня неплохая погода.'],
['下雨','xiàyǔ','идёт дождь','外面下雨了。','Wàimiàn xiàyǔ le.','На улице пошёл дождь.'],
['热','rè','жарко; горячий','今天太热了。','Jīntiān tài rè le.','Сегодня слишком жарко.'],
['冷','lěng','холодно; холодный','外面很冷。','Wàimiàn hěn lěng.','На улице холодно.'],
['漂亮','piàoliang','красивый','这里很漂亮。','Zhèlǐ hěn piàoliang.','Здесь очень красиво.'],
['高兴','gāoxìng','радостный; рад','见到你很高兴。','Jiàn dào nǐ hěn gāoxìng.','Рад тебя видеть.'],
['麻烦','máfan','хлопоты; беспокоить','麻烦你帮我一下。','Máfan nǐ bāng wǒ yíxià.','Не мог бы ты мне помочь?'],
['不好意思','bù hǎoyìsi','извините; неловко','不好意思，我来晚了。','Bù hǎoyìsi, wǒ lái wǎn le.','Извините, я опоздал.'],
['没关系','méi guānxi','ничего страшного','没关系，别担心。','Méi guānxi, bié dānxīn.','Ничего страшного, не волнуйся.'],
['为什么','wèishénme','почему','你为什么迟到？','Nǐ wèishénme chídào?','Почему ты опоздал?'],
['怎么','zěnme','как; каким образом','这个怎么用？','Zhège zěnme yòng?','Как этим пользоваться?'],
['哪里','nǎlǐ','где; куда','你住在哪里？','Nǐ zhù zài nǎlǐ?','Где ты живёшь?'],
['多少','duōshao','сколько','这里有多少人？','Zhèlǐ yǒu duōshao rén?','Сколько здесь людей?'],

];
const words=raw.map((r,i)=>({id:i,zh:r[0],py:r[1],ru:r[2],ex:r[3],expy:r[4],exru:r[5]}));
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plain=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ü/g,'v').replace(/\s+/g,'');
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const oldFav=get('hanzigo-fav',[]);let saved=get('hanzigo-v2-saved',[]);if(!localStorage.getItem('hanzigo-v2-migrated')){saved=[...new Set([...saved,...oldFav.map(x=>typeof x==='number'?x:typeof x==='string'?words.find(w=>w.zh===x)?.id:undefined).filter(x=>x!==undefined)])];localStorage.setItem('hanzigo-v2-saved',JSON.stringify(saved));localStorage.setItem('hanzigo-v2-migrated','1')}
let review=get('hanzigo-v2-review',{}),tab='dictionary',query='',detail=null,cardIndex=0,flipped=false,filter='due';
function toast(t){let e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.style.display='none',2500)}
function speak(s){if(!('speechSynthesis'in window)){toast('Озвучивание недоступно в этом браузере');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='zh-CN';u.rate=.82;let v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('zh'));if(v)u.voice=v;speechSynthesis.speak(u)}
function toggle(id){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];localStorage.setItem('hanzigo-v2-saved',JSON.stringify(saved));render()}
function item(w){return `<div class="item"><div class="grow" data-open="${w.id}"><div class="hanzi">${esc(w.zh)}</div><div class="py">${esc(w.py)}</div><div class="meaning">${esc(w.ru)}</div></div><button class="iconbtn" data-speak="${w.id}" aria-label="Произнести">🔊</button><button class="iconbtn ${saved.includes(w.id)?'saved':''}" data-save="${w.id}" aria-label="Избранное">${saved.includes(w.id)?'♥':'♡'}</button></div>`}
function dictionary(){let found=words.filter(w=>plain(w.zh).includes(plain(query))||plain(w.py).includes(plain(query))||plain(w.ru).includes(plain(query)));return `<p class="sub">Китайско-русский словарь • произношение и примеры</p><input id="search" type="search" placeholder="Поиск: 你好, nihao, привет…" value="${esc(query)}" autocomplete="off"><div class="row"><h2>Слова</h2><span class="small">${found.length} из ${words.length}</span></div><div id="results" class="list">${found.length?found.map(item).join(''):'<div class="empty">Ничего не найдено. Попробуй другое слово.</div>'}</div>`}
function detailView(w){return `<button class="back" data-back="1">← Назад к словарю</button><div class="panel" style="margin-top:18px"><div class="detailH">${esc(w.zh)}</div><div class="detailPy">${esc(w.py)}</div><div class="detailMeaning">${esc(w.ru)}</div><div class="actions"><button class="btn secondary" data-speak="${w.id}">🔊 Слушать</button><button class="btn" data-save="${w.id}">${saved.includes(w.id)?'♥ В избранном':'♡ Сохранить'}</button></div><h2>Пример</h2><div class="example"><div class="zh">${esc(w.ex)}</div><div class="latin">${esc(w.expy)}</div><div class="ru">${esc(w.exru)}</div></div><button class="btn secondary" style="width:100%;margin-top:12px" data-example="${w.id}">🔊 Слушать пример</button></div>`}
function savedView(){let arr=saved.map(id=>words[id]).filter(Boolean);return `<p class="sub">Слова, которые ты хочешь запомнить</p><div class="row"><h2>Мои слова</h2><span class="small">${arr.length}</span></div>${arr.length?`<div class="list">${arr.map(item).join('')}</div>`:'<div class="empty">Пока пусто. Нажми ♡ возле слова в словаре.</div>'}`}
function dueIds(){return saved.filter(id=>!review[id]||review[id].next<=Date.now())}
function cardsView(){let ids=filter==='all'?saved:dueIds();if(cardIndex>=ids.length)cardIndex=0;let w=words[ids[cardIndex]];return `<p class="sub">Повторяй слова, чтобы лучше их запоминать</p><div class="stat"><div class="panel"><strong>${saved.length}</strong><span class="small">Сохранено</span></div><div class="panel"><strong>${dueIds().length}</strong><span class="small">Повторить</span></div></div><div class="row"><h2>Карточки</h2><select id="cardfilter"><option value="due" ${filter==='due'?'selected':''}>На сегодня</option><option value="all" ${filter==='all'?'selected':''}>Все слова</option></select></div>${w?`<div class="small" style="text-align:center;margin-bottom:10px">${cardIndex+1} / ${ids.length}</div><div class="card" data-flip="1"><div class="hanzi">${esc(w.zh)}</div>${flipped?`<div class="py">${esc(w.py)}</div><div class="meaning">${esc(w.ru)}</div>`:'<p class="small">Нажми, чтобы увидеть перевод</p>'}</div><div class="actions">${flipped?'<button class="btn secondary" data-grade="again">Повторить</button><button class="btn" data-grade="good">Знаю ✓</button>':'<button class="btn" data-flip="1">Показать ответ</button>'}</div><p class="muted">«Знаю» откладывает карточку на 1, 3, 7, 14 дней и далее. «Повторить» вернёт её через минуту.</p>`:'<div class="empty">'+(saved.length?'На сегодня всё! Переключи на «Все слова», чтобы тренироваться ещё.':'Сначала добавь слова в избранное ♡')+'</div>'}`}
function grade(g){let ids=filter==='all'?saved:dueIds(),id=ids[cardIndex];if(id===undefined)return;let r=review[id]||{level:0};let level=g==='good'?Math.min(r.level+1,5):0;let days=[0,1,3,7,14,30][level];review[id]={level,next:Date.now()+(g==='good'?days*86400000:60000)};localStorage.setItem('hanzigo-v2-review',JSON.stringify(review));flipped=false;if(filter==='all')cardIndex=(cardIndex+1)%ids.length;render()}
function render(){document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('active',e.dataset.tab===tab));$('#app').innerHTML=detail!==null?detailView(words[detail]):tab==='dictionary'?dictionary():tab==='saved'?savedView():cardsView()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-open],[data-save],[data-speak],[data-example],[data-back],[data-flip],[data-grade],[data-tab]');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;detail=null;flipped=false;cardIndex=0;render()}else if(b.dataset.open!==undefined){detail=Number(b.dataset.open);render()}else if(b.dataset.save!==undefined)toggle(Number(b.dataset.save));else if(b.dataset.speak!==undefined)speak(words[Number(b.dataset.speak)].zh);else if(b.dataset.example!==undefined)speak(words[Number(b.dataset.example)].ex);else if(b.dataset.back!==undefined){detail=null;render()}else if(b.dataset.flip!==undefined){flipped=!flipped;render()}else if(b.dataset.grade)grade(b.dataset.grade)});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;let pos=e.target.selectionStart;render();let s=$('#search');s.focus();s.setSelectionRange(pos,pos)}});document.addEventListener('change',e=>{if(e.target.id==='cardfilter'){filter=e.target.value;cardIndex=0;flipped=false;render()}});render();
</script></body></html>
